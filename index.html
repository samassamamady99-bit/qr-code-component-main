<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; 
                    margin-top: 200px;
    }
    .attribution a { color: hsl(228, 45%, 44%); }
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      background-color: hsl(212, 45%, 89%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px;
      font-family: Arial, Helvetica, sans-serif;
    }
    main{
      width: 300px;
      background-color: hsl(0, 0%, 100%);
      padding: 15px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }
    main img{
      width: 100%;
      border-radius: 15px;
    }
    h2{
      font-size: 1.2rem;
    }
    p{
      font-size: 0.9rem;
      color: hsl(216, 15%, 48%);
    }
  </style>
</head>
<body>
  <main>
    <img src="images/image-qr-code.png" alt="" srcset="">
    <h2>Improve your front-end skills by build projects</h2>
    <p>Scan the QR code to visit the Frontend Mentor and take your coding skills to the next level</p>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Mamady SAMASSA</a>.
  </footer>
</body>
</html>
